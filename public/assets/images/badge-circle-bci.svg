<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bciGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadowBci" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="40" cy="40" r="38" fill="#ffffff" filter="url(#shadowBci)"/>
  
  <!-- Gradient Ring -->
  <circle cx="40" cy="40" r="36.5" fill="none" stroke="url(#bciGrad)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="215 15" stroke-dashoffset="190"/>

  <!-- Content: Bar Council Seal -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Red Seal Circle -->
    <circle cx="40" cy="28" r="11" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="40" cy="28" r="8.5" fill="#fef2f2"/>
    <!-- Scales of justice / emblem -->
    <path d="M40 21 L40 35 M34 25 L46 25 M32 29 L36 29 M44 29 L48 29" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round"/>
    
    <text x="40" y="48" font-size="6.5" font-weight="900" fill="#111827" letter-spacing="0.2">BAR COUNCIL</text>
    <text x="40" y="56" font-size="5" font-weight="800" fill="#dc2626" letter-spacing="0.4">OF INDIA</text>
    <text x="40" y="65" font-size="4" font-weight="700" fill="#6b7280">LEGAL EDU.</text>
  </g>
</svg>
