<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="abetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadowAbet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="40" cy="40" r="38" fill="#ffffff" filter="url(#shadowAbet)"/>
  
  <!-- Gradient Ring -->
  <circle cx="40" cy="40" r="36.5" fill="none" stroke="url(#abetGrad)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="210 20" stroke-dashoffset="80"/>

  <!-- Content -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Iconic ABET Orange Ring Logo -->
    <circle cx="40" cy="27" r="10.5" fill="none" stroke="#f97316" stroke-width="3.8"/>
    
    <!-- ABET Wordmark -->
    <text x="40" y="49" font-size="11" font-weight="900" fill="#111827" letter-spacing="1">ABET</text>
    
    <!-- Accredited Pill -->
    <text x="40" y="58" font-size="4.8" font-weight="800" fill="#f97316" letter-spacing="0.5">ACCREDITED</text>
    
    <!-- Engineering Programs -->
    <text x="40" y="65" font-size="3.8" font-weight="700" fill="#4b5563">CSE · ECE · MECH</text>
  </g>
</svg>
