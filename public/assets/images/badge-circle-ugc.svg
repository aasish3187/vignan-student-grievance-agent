<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="ugcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadowUgc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="40" cy="40" r="38" fill="#ffffff" filter="url(#shadowUgc)"/>
  
  <!-- Gradient Ring -->
  <circle cx="40" cy="40" r="36.5" fill="none" stroke="url(#ugcGrad)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="210 20" stroke-dashoffset="150"/>

  <!-- Content -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- UGC Emblem Crest -->
    <g transform="translate(40, 24)">
      <!-- Ashoka wheel ring -->
      <circle cx="0" cy="0" r="8" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#1e3a8a"/>
      <!-- Book open wings -->
      <path d="M-9 5 Q-4 2 0 4 Q4 2 9 5 L8 7 Q4 4 0 6 Q-4 4 -8 7 Z" fill="#1e3a8a"/>
    </g>

    <!-- UGC Main -->
    <text x="40" y="44" font-size="12" font-weight="900" fill="#1e3a8a" letter-spacing="0.5">UGC</text>
    
    <!-- Category Pill -->
    <rect x="18" y="48" width="44" height="9" rx="4.5" fill="#1e3a8a"/>
    <text x="40" y="55" font-size="5.2" font-weight="800" fill="#ffffff" letter-spacing="0.3">CATEGORY - I</text>

    <!-- Subtitle -->
    <text x="40" y="65" font-size="4.2" font-weight="700" fill="#4b5563">DEEMED TO BE UNIV</text>
  </g>
</svg>
