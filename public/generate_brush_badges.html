<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 20px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .grid {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .badge-card {
    position: relative;
    width: 116px;
    height: 116px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .inner-disc {
    position: absolute;
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    box-sizing: border-box;
    padding: 6px;
    text-align: center;
  }
  .frame-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 116px;
    height: 116px;
    z-index: 2;
    pointer-events: none;
  }

  /* Typography */
  .badge-title {
    font-size: 13px;
    font-weight: 900;
    line-height: 1.1;
    color: #111827;
    letter-spacing: 0.3px;
  }
  .badge-sub {
    font-size: 7.5px;
    font-weight: 700;
    color: #4b5563;
    line-height: 1.15;
    margin-top: 2px;
  }
  .badge-accent {
    font-size: 8px;
    font-weight: 800;
    line-height: 1.2;
    margin-top: 1px;
  }
</style>
</head>
<body>
  <div class="grid">

    <!-- 1. AICTE -->
    <div id="badge-aicte" class="badge-card">
      <div class="inner-disc">
        <!-- SVG Cogwheel -->
        <svg width="34" height="34" viewBox="0 0 34 34">
          <circle cx="17" cy="17" r="14" fill="#fbbf24"/>
          <circle cx="17" cy="17" r="10" fill="#d97706"/>
          <circle cx="17" cy="17" r="7.5" fill="#1e3a8a"/>
          <path d="M17 12 C18.5 14, 19 16, 17 18 C15 16, 15.5 14, 17 12 Z" fill="#fbbf24"/>
        </svg>
        <div class="badge-title" style="color: #b45309; margin-top: 2px;">AICTE</div>
        <div class="badge-sub" style="font-size: 7px;">APPROVED</div>
      </div>
      <img src="assets/images/brush-frame-transparent.png" class="frame-img">
    </div>

    <!-- 2. UGC -->
    <div id="badge-ugc" class="badge-card">
      <div class="inner-disc">
        <!-- SVG UGC Emblem -->
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
          <circle cx="15" cy="15" r="13" stroke="#2563eb" stroke-width="1.8" fill="#eff6ff"/>
          <path d="M15 6 L18 12 L24 12 L19 16 L21 22 L15 18 L9 22 L11 16 L6 12 L12 12 Z" fill="#1d4ed8"/>
        </svg>
        <div class="badge-title" style="color: #1e40af; margin-top: 2px;">UGC</div>
        <div class="badge-sub" style="font-size: 6.8px; font-weight: 800; color: #1e3a8a;">CATEGORY-I</div>
      </div>
      <img src="assets/images/brush-frame-teal-pink.png" class="frame-img">
    </div>

    <!-- 3. BCI (Bar Council of India) -->
    <div id="badge-bci" class="badge-card">
      <div class="inner-disc">
        <!-- SVG BCI Scales of Justice / Emblem -->
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="12" stroke="#dc2626" stroke-width="1.6" fill="#fef2f2"/>
          <line x1="14" y1="5" x2="14" y2="23" stroke="#991b1b" stroke-width="1.5"/>
          <line x1="7" y1="9" x2="21" y2="9" stroke="#991b1b" stroke-width="1.5"/>
          <path d="M7 9 L5 15 H9 Z" fill="#b91c1c"/>
          <path d="M21 9 L19 15 H23 Z" fill="#b91c1c"/>
        </svg>
        <div class="badge-title" style="color: #991b1b; margin-top: 2px; font-size: 11px;">BAR COUNCIL</div>
        <div class="badge-sub" style="font-size: 6.5px;">OF INDIA</div>
      </div>
      <img src="assets/images/brush-frame-transparent.png" class="frame-img">
    </div>

    <!-- 4. ABET -->
    <div id="badge-abet" class="badge-card">
      <div class="inner-disc">
        <!-- ABET Orange Circle & Bold Type -->
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
          <circle cx="15" cy="15" r="11" stroke="#ea580c" stroke-width="4" fill="none"/>
        </svg>
        <div class="badge-title" style="color: #c2410c; margin-top: 2px; font-size: 12px; letter-spacing: 0.5px;">ABET</div>
        <div class="badge-sub" style="font-size: 6.5px;">ACCREDITED</div>
      </div>
      <img src="assets/images/brush-frame-teal-pink.png" class="frame-img">
    </div>

  </div>
</body>
</html>
